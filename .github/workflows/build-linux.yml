name: Build Linux

# avatar Linux build-green dev loop (issue #21; part of the M8 Linux epic, meta
# displayxr-runtime#699; recipe: the runtime repo's docs/guides/linux-demo-port.md).
#
# TRI-LTS MATRIX (mirrors displayxr-demo-modelviewer): the deployment target is
# Ubuntu 26.04 + Intel iGPU, but we also keep 22.04 (where render can be
# validated on hand today) and 24.04 green — so "build-green" means "builds on
# every supported toolchain (GCC 11 / 13 / 15)", not just whatever
# ubuntu-latest happens to be. 22.04/24.04 use hosted runners; 26.04 runs in a
# container (no hosted 26.04 runner yet).
#
# PROMOTED to a PR-triggered required check (runtime #722): runs on every PR
# (plus manual dispatch and `linux*` branches), with the DetectChanges
# docs_only short-circuit the macOS/Windows jobs use so doc-only PRs report
# success in seconds without building.
#
# Build-green scope: compile avatar_handle_vk_linux. CI has no display/GPU, so
# the app is never run here. On-screen operation is NOT gated any more — the
# leg runs on real hardware (see CLAUDE.md § Linux) — but validating it stays a
# separate manual pass, because weave geometry cannot be checked without a
# vendor panel.

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - 'linux'
      - 'linux-**'
      - 'feature/linux-**'
    # Release tags: the Deb job attaches the demo .deb to the GitHub Release
    # (the Linux meta-bundle fetches it — runtime #781 Phase 3).
    tags:
      - 'v*'

# The Deb job attaches release assets on tags.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Detected non-PR trigger — docs_only=false"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  Build:
    name: Build (Ubuntu ${{ matrix.lts }})
    needs: DetectChanges
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lts: "22.04"
            runner: ubuntu-22.04
          - lts: "24.04"
            runner: ubuntu-24.04
          - lts: "26.04"
            runner: ubuntu-latest
            container: ubuntu:26.04
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      # In the 26.04 container we start as root with a bare image — install git
      # BEFORE checkout (which shells out to git). No-op on the hosted runners.
      - name: Bootstrap container (git for checkout)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          if [ "$(id -u)" = "0" ] && ! command -v git >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'

      # Base list (docs/guides/linux-demo-port.md): the toolchain + system
      # Vulkan + glslang (model_common compiles its PBR SPIR-V with
      # glslangValidator, hard-required). The avatar demo is a Vulkan model/PBR
      # renderer with NO media deps, so — unlike the mediaplayer — no FFmpeg.
      #
      # X11 / Wayland / ALSA dev headers + the GLX-flip pair (libxxf86vm-dev +
      # libxcb-glx0-dev). The app creates its OWN X11 window, so libx11-dev
      # (Xlib + XKBlib), libxext-dev (XShape click-through) and libxrandr-dev
      # (panel rect) are hard requirements, not just standard demo-port deps;
      # the rest guard the from-source OpenXR-SDK loader build against the
      # GLX-flip gotcha should GL/EGL headers ever be pulled in (see the
      # playbook).
      # SUDO shim so the same step works on hosted runners (non-root, has sudo)
      # and in the container (root, no sudo).
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y \
            build-essential cmake ninja-build pkg-config git ca-certificates curl \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libx11-dev libxext-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libasound2-dev \
            libxxf86vm-dev libxcb-glx0-dev \
            libxrandr-dev

      - name: Build (build-green; app is not run — no display on CI)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./scripts/build_linux.sh

      # Guard against a hollow green: Vulkan must have resolved (the renderer is
      # 100% Vulkan) and the binary must exist. build_linux.sh already errors if
      # the binary is missing; assert Vulkan here so a silent FindVulkan miss
      # fails loudly rather than compiling out.
      - name: Assert Vulkan resolved + binary built
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          grep -q "Vulkan_LIBRARY:.*=.*/" build/CMakeCache.txt || {
            echo "::error::Vulkan was not found via find_package — the model renderer cannot build"; exit 1; }
          test -x build/linux/avatar_handle_vk_linux || {
            echo "::error::avatar_handle_vk_linux was not produced"; exit 1; }

  # Build the ONE demo .deb and, once DebInstall has proved it, attach it to the
  # GitHub Release on a v* tag — the asset the Linux meta-bundle fetches
  # (runtime #781 Phase 3). Runs on every PR too so a broken
  # package_deb_linux.sh is caught before release.
  #
  # PORTABLE BY CONSTRUCTION (runtime #1656 / its PR #1659): the same .deb must
  # install AND run on Ubuntu 22.04, 24.04 and 26.04, so it is built on the
  # OLDEST — an ubuntu:22.04 container (glibc 2.35 / GCC 11 floor). v0.12.0 was
  # built on the 24.04 runner, needed GLIBC_2.38 / GLIBCXX_3.4.32, and declared
  # an unversioned `libc6`, so apt installed it on 22.04 and the demo then died
  # at exec with "version `GLIBC_2.38' not found". package_deb_linux.sh now
  # derives versioned Depends with dpkg-shlibdeps, refuses a DT_NEEDED outside
  # its cross-release STABLE_SONAMES list, and — with DXR_DEB_MAX_GLIBC —
  # refuses a glibc floor above 22.04's.
  #
  # The container deliberately uses 22.04's apt cmake (3.22.1), which is above
  # this repo's 3.21 floor: a runner image's modern CMake would hide the real
  # floor.
  Deb:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DXR_DEB_MAX_GLIBC: "2.35" # Ubuntu 22.04 — the oldest supported release
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — skipping .deb build."

      # Bare image, root: git must land BEFORE actions/checkout, or it falls
      # back to a tarball with no tags and git describe cannot version the .deb.
      - name: Bootstrap container (git for checkout)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          fetch-depth: 0 # git describe needs tags for the .deb version

      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libvulkan-dev glslang-tools \
            libx11-dev libxext-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libasound2-dev \
            libxxf86vm-dev libxcb-glx0-dev \
            libxrandr-dev \
            file binutils dpkg-dev fakeroot
          cmake --version | head -1

      - name: Build + package the demo .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/package_deb_linux.sh
          ls -lh dist/*.deb

      - name: Upload .deb artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: displayxr-avatar-deb
          path: dist/*.deb
          if-no-files-found: error

  # Install the .deb from the Deb job into a PRISTINE container of every
  # supported release, alongside the latest released runtime .deb (the demo
  # Depends on displayxr-runtime), and exercise it there
  # (scripts/verify_deb_install_linux.sh): apt must resolve Depends from that
  # release's archive without Recommends, every Depends/Recommends/Suggests
  # name must exist there, `ldd -r` must be clean on every shipped ELF, the
  # launcher must get past the dynamic loader, and `displayxr-cli selftest`
  # must pass env-free on the packaged sim-display.
  DebInstall:
    name: DebInstall (Ubuntu ${{ matrix.lts }})
    needs: [DetectChanges, Deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lts: ["22.04", "24.04", "26.04"]
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — no .deb to verify."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'

      - uses: actions/download-artifact@v4
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          name: displayxr-avatar-deb
          path: dist

      - name: Fetch the latest released runtime .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo DisplayXR/displayxr-runtime \
            --pattern 'displayxr-runtime_*_amd64.deb' --dir runtime-deb
          ls runtime-deb

      - name: apt install + ldd -r + launch smoke in clean ubuntu:${{ matrix.lts }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.lts }}" \
            ./scripts/verify_deb_install_linux.sh \
              dist/displayxr-avatar_*_amd64.deb runtime-deb/*.deb

  # Attach the .deb to the GitHub Release on a v* tag — only once DebInstall
  # has proved it on every supported release, so a non-portable package can
  # never be published.
  DebRelease:
    needs: [DetectChanges, Deb, DebInstall]
    if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: displayxr-avatar-deb
          path: dist

      - name: Attach .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true
