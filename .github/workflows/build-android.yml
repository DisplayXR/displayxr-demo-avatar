name: Build Android

# Android APK build for the avatar demo (com.displayxr.avatar_vk_android, the
# OpenXR client that binds the installed DisplayXR runtime out-of-process).
# Mirrors build-windows.yml / build-macos.yml: PR + push-to-main runs are validation
# only; on a v* tag this builds a RELEASE-SIGNED APK and attaches it to the GitHub
# Release alongside the .exe / .pkg. (The Android leg had no CI before — releases
# shipped desktop installers only; this closes that gap.)
#
# Signing is driven entirely by repo secrets — no keystore lives in the repo:
#   ANDROID_KEYSTORE_BASE64  ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
# build.gradle reads ANDROID_KEYSTORE_FILE + the passwords from the env (set below).
# A build with those unset (e.g. a fork) produces an UNSIGNED release APK and skips
# the attach, so it never fails for want of the key.
#
# versions.json DispatchVersionsBump is intentionally NOT here — build-windows.yml
# already bumps the demo on a tag; duplicating it would double-dispatch.

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -n "$CHANGED" ] && [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  BuildApk:
    name: Build Android
    needs: DetectChanges
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

      # The wake library is a release asset on the runtime repo, not a Maven artifact
      # (the org's GitHub Packages budget is a $0 hard stop). Gradle deliberately does
      # NOT download it during configuration -- a configure phase that reaches the
      # network breaks offline builds -- so it is fetched here, before the build. The
      # script needs no credential: the runtime repo is public, and this job's
      # GITHUB_TOKEN is not a credential for it anyway.
      - name: Fetch the DisplayXR client wake library
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./android/fetch-client-aar.sh
      - name: Doc-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "docs_only=true; build steps will skip and report success."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          # Full history + tags: the APK version stamps come from
          # `git describe --tags` (#60). A shallow or tagless checkout makes
          # describe fail and the build errors out rather than guessing.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: android-actions/setup-android@v3

      - name: Install glslangValidator (shader compile)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Decode release keystore
        if: needs.DetectChanges.outputs.docs_only != 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease --no-daemon

      # ---- versionCode / versionName gate (#60) ---------------------------
      # Prove the stamps FROM THE ARTIFACT, never from the inputs that were
      # supposed to produce them. Three failures this catches, all of which have
      # shipped somewhere in the org:
      #   * versionCode/versionName hardcoded (1 / "0.1") -- the #60 bug: no
      #     on-device version signal at all, and a version-gated device test
      #     reads "0.1", concludes "old app", and passes green proving nothing.
      #   * EMPTY versionCode from a tagless/shallow clone + a swallowed
      #     exception (runtime#1226). Android then cannot compare versions, so
      #     no installed unit can upgrade in place.
      #   * WRONG base tag: `git describe` without `--tags` sees only ANNOTATED
      #     tags and ours are lightweight (runtime#1379).
      # scripts/android_version_code.py is an independent implementation of the
      # arithmetic in android/build.gradle; comparing the two is the point.
      - name: Verify APK version stamps
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          python3 scripts/android_version_code.py --selftest

          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no release APK found under android/build/outputs/apk/release"
            exit 1
          fi
          AAPT2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::no aapt2 under \$ANDROID_HOME/build-tools -- cannot read the APK manifest"
            exit 1
          fi

          badging=$("$AAPT2" dump badging "$APK")
          vcode=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          vname=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK stamps: versionCode='${vcode}' versionName='${vname}'"

          if [ -z "$vcode" ]; then
            echo "::error::APK has an EMPTY versionCode. Android cannot compare versions, so no installed unit can upgrade in place."
            exit 1
          fi
          case "$vcode" in
            ''|*[!0-9]*) echo "::error::versionCode '$vcode' is not a plain integer"; exit 1 ;;
          esac
          if [ "$vcode" -le 1 ]; then
            echo "::error::versionCode $vcode is <= 1, the hardcoded value every shipped demo APK carries (#60). Android refuses downgrades and an in-place upgrade would be ambiguous."
            exit 1
          fi

          describe=$(git describe --tags --long --match 'v[0-9]*')
          want_code=$(python3 scripts/android_version_code.py --describe "$describe" --print code)
          want_name=$(python3 scripts/android_version_code.py --describe "$describe" --print name)
          echo "expected from '$describe': versionCode=$want_code versionName=$want_name"

          if [ "$vcode" != "$want_code" ]; then
            echo "::error::versionCode $vcode does not match the tag arithmetic for '$describe' (expected $want_code). android/build.gradle and scripts/android_version_code.py have diverged."
            exit 1
          fi
          # A dirty CI tree is its own problem; do not let it mask the check.
          if [ "${vname%-dirty}" != "$want_name" ]; then
            echo "::error::versionName '$vname' does not match '$want_name' derived from '$describe'. If it names an older release than the tag you are building, git describe lost --tags."
            exit 1
          fi
          # On a tag build the APK's versionName must EQUAL the tag -- this is the
          # assertion #60 asks for. A `-<n>-g<sha>` suffix here means the tag is
          # not the commit being built, which is just as wrong as naming a
          # different release.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${vname%-dirty}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag build of $GITHUB_REF_NAME produced versionName '$vname'. The released APK must name itself after the tag it was built from (#60)."
            exit 1
          fi
          echo "  ok: versionCode=$vcode versionName=$vname (above the shipped 1, matches $describe)"

      - name: Stage the APK with a release name
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev-${GITHUB_SHA::8}"
          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p out
          cp "$APK" "out/DisplayXRAvatar-${VER}.apk"
          ls -la out

      - name: Upload APK artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DisplayXRAvatar-apk
          path: out/*.apk

      # Attach to the GitHub Release on a v* tag (alongside the .exe / .pkg). Only
      # when the APK is release-signed (keystore secret present) — never publish an
      # unsigned APK to a release.
      - name: Attach APK to GitHub release on tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v3
        with:
          files: out/DisplayXRAvatar-*.apk
          fail_on_unmatched_files: true
